<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puja Gupta — Editor, Author Consultant, Poet</title>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=gambarino@400&f[]=switzer@300,400,500,600,700&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FDF7EB;
    --gold:#F2CE74;
    --gold-wash:#FBEFC9;
    --olive:#565A3D;
    --olive-dark:#3B3E29;
    --sage:#D7D6A5;
    --rust:#96341E;
    --ink:#2E2E1F;
    --ink-soft:#5B5A46;
    --about-bg:#D1BBA4;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--ivory);color:var(--ink);font-family:'Switzer', sans-serif;font-weight:300;overflow-x:hidden;}
  ::selection{background:var(--olive);color:var(--ivory);}
  h1,h2,h3,.display{font-family:'Gambarino', serif;font-weight:700;letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}
  .script{font-family:'Caveat', cursive;font-weight:600;}
  .kicker{font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--olive);font-weight:600;}
  section{padding:clamp(3.5rem,7vw,5.5rem) clamp(1.5rem,5vw,4rem);}

  #intro{
    position:fixed;inset:0;background:var(--olive-dark);z-index:9999;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;
    transition:transform 0.9s cubic-bezier(.76,0,.24,1), opacity 0.6s ease 0.3s;
  }
  #intro.hide{transform:translateY(-100%);opacity:0.9;pointer-events:none;}
  #intro svg{width:42px;height:42px;stroke:var(--gold);}
  .intro-mono{font-family:'Gambarino', serif;font-weight:700;font-size:clamp(3rem,12vw,6rem);color:var(--gold);line-height:0.85;}
  .intro-tag{font-size:0.72rem;letter-spacing:0.24em;color:var(--sage);text-transform:uppercase;}

  .btn{background:var(--olive);color:var(--ivory);padding:0.85rem 1.7rem;font-size:0.78rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;font-family:'Switzer',sans-serif;display:inline-block;border-radius:100px;transition:background 0.2s ease, transform 0.2s ease;border:none;cursor:pointer;}
  .btn:hover{background:var(--olive-dark);transform:translateY(-2px);}
  .btn-gold{background:var(--gold);color:var(--olive-dark);}
  .btn-gold:hover{background:#e8bd52;}
  .link-line{font-size:0.78rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:500;border-bottom:1.5px solid var(--ink);padding-bottom:2px;}

  /* ---------- HERO: overlapping word-chips on photo/block seam ---------- */
  .hero{position:relative;min-height:720px;overflow:hidden;}
  .hero-photo{position:absolute;left:0;top:0;width:58%;height:100%;overflow:hidden;}
  .hero-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-mark{position:absolute;top:1.8rem;left:1.8rem;width:26px;height:26px;stroke:var(--ivory);z-index:3;}
  .hero-block{position:absolute;right:0;top:0;width:42%;height:100%;background:var(--sage);}
  .hero-nav{position:absolute;top:1.8rem;right:clamp(1.2rem,3vw,2.2rem);display:flex;flex-direction:column;align-items:flex-end;gap:0.5rem;z-index:3;}
  .hero-nav::before{content:'';position:absolute;right:4px;top:4px;bottom:4px;width:1px;background:rgba(46,46,31,0.25);}
  .hero-nav a{font-size:0.68rem;letter-spacing:0.08em;text-transform:uppercase;font-weight:500;position:relative;padding-right:1.1rem;color:var(--olive-dark);}
  .hero-nav a::after{content:'';position:absolute;right:0px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--olive-dark);}

  .word-chip{position:absolute;top:44%;transform:translateY(-50%);font-family:'Gambarino', serif;font-weight:400;font-style:italic;font-size:clamp(2.1rem,4.6vw,3.4rem);padding:0.22em 0.55em;border-radius:8px;z-index:4;white-space:nowrap;box-shadow:0 18px 34px rgba(46,46,31,0.28);}
  .word-puja{right:41%;background:var(--sage);color:var(--olive-dark);}
  .word-gupta{left:57%;background:var(--rust);color:var(--ivory);}

  .hero-block-content{position:absolute;left:60%;right:6%;bottom:9%;z-index:3;}
  .hero-role{font-family:'Switzer',sans-serif;font-weight:700;font-size:0.95rem;letter-spacing:0.03em;color:var(--olive-dark);margin-bottom:0.9rem;}
  .hero-sub{font-size:0.98rem;line-height:1.6;color:var(--ink);font-weight:500;margin-bottom:1.4rem;max-width:34ch;}
  .hero-actions{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;}
  .hero-actions .link-line{color:var(--olive-dark);border-color:var(--olive-dark);}

  /* ---------- STAT STRIP ---------- */
  .strip{background:var(--sage);padding:1.1rem clamp(1.5rem,5vw,4rem);}
  .strip-row{display:flex;justify-content:center;gap:2.5rem;flex-wrap:wrap;font-family:'Gambarino',serif;font-weight:600;font-size:0.85rem;letter-spacing:0.03em;color:var(--olive-dark);text-transform:uppercase;}
  .strip-row span.acc{color:var(--ink);border-bottom:2px solid var(--gold);padding-bottom:2px;}

  /* ---------- ABOUT: photo fades/dissolves into the backdrop color ---------- */
  .about{position:relative;min-height:560px;display:flex;align-items:stretch;background:var(--about-bg);overflow:hidden;}
  .about-photo-bg{position:absolute;inset:0;
    -webkit-mask-image:linear-gradient(to right, black 0%, black 52%, transparent 88%);
    mask-image:linear-gradient(to right, black 0%, black 52%, transparent 88%);
  }
  .about-photo-bg img{width:100%;height:100%;object-fit:cover;object-position:left center;display:block;}
  .about-copy{position:relative;z-index:2;margin-left:auto;width:min(560px, 52%);display:flex;flex-direction:column;justify-content:center;gap:1.2rem;padding:clamp(2.5rem,6vw,4.5rem);}
  .about-copy .kicker{color:#7a5a2e;}
  .about-copy h2{font-size:clamp(1.9rem,3.4vw,2.6rem);line-height:1.15;color:#2E2412;}
  .about-copy p{max-width:52ch;line-height:1.7;color:#4A3A24;}
  .about-copy .sig{font-family:'Caveat', cursive;font-weight:600;font-size:1.7rem;color:var(--olive-dark);margin-top:0.2rem;}

  /* ---------- CONTRIBUTION ---------- */
  .contrib-wrap{background:var(--ivory);}
  .contrib-intro{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start;margin-bottom:3rem;}
  .contrib-intro h2{font-size:clamp(1.9rem,3.6vw,2.7rem);line-height:1.15;margin:0.6rem 0 1.2rem;max-width:14ch;}
  .contrib-intro p{color:var(--ink-soft);line-height:1.7;max-width:52ch;}
  .contrib-visuals{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
  .contrib-visuals figure{position:relative;margin:0;border-radius:14px;overflow:hidden;min-height:220px;box-shadow:0 18px 36px rgba(46,46,31,0.15);}
  .contrib-visuals img{width:100%;height:100%;object-fit:cover;display:block;}
  .contrib-visuals figure:nth-child(2){margin-top:2rem;}
  .contrib-visuals figcaption{position:absolute;left:1rem;bottom:1rem;right:1rem;font-family:'Caveat',cursive;font-weight:600;font-size:1.15rem;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.5);}

  .poetry-row{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:3rem;}
  .poetry-card{background:var(--gold-wash);border-radius:14px;padding:1.8rem;border-left:3px solid var(--olive);}
  .poetry-card .tag{font-size:0.68rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--olive-dark);font-weight:600;margin-bottom:0.5rem;}
  .poetry-card h3{font-size:1.3rem;margin-bottom:0.4rem;color:var(--ink);}
  .poetry-card a{font-size:0.8rem;color:var(--olive-dark);font-weight:600;}

  .shelf-label{font-size:1rem;color:var(--ink-soft);margin-bottom:1.6rem;font-style:italic;font-family:'Switzer',sans-serif;}
  .carousel{position:relative;display:flex;align-items:center;justify-content:center;gap:1.5rem;padding:1rem 0 0.5rem;min-height:420px;}
  .car-btn{background:var(--olive);color:var(--ivory);border:none;width:46px;height:46px;border-radius:50%;font-size:1.2rem;cursor:pointer;flex-shrink:0;transition:background 0.2s ease;}
  .car-btn:hover{background:var(--olive-dark);}
  .car-track{position:relative;display:flex;align-items:center;justify-content:center;width:min(680px, 74vw);height:380px;}
  .car-slide{position:absolute;transition:transform 0.45s cubic-bezier(.16,1,.3,1), opacity 0.45s ease, filter 0.45s ease;border-radius:10px;overflow:hidden;box-shadow:0 24px 48px rgba(46,46,31,0.28);}
  .car-slide img{width:100%;height:100%;object-fit:cover;display:block;}
  .car-caption{text-align:center;margin-top:1rem;font-family:'Gambarino',serif;font-weight:600;color:var(--ink);font-size:1.05rem;}
  .car-note{text-align:center;margin-top:0.4rem;font-size:0.78rem;color:var(--ink-soft);font-style:italic;}

  /* ---------- BLOG ---------- */
  .blog-wrap{background:var(--sage);}
  .blog-head{margin-bottom:2.2rem;}
  .blog-head h2{font-size:clamp(1.9rem,3.6vw,2.7rem);margin-top:0.6rem;max-width:16ch;}
  .blog-card{background:var(--ivory);border-radius:16px;overflow:hidden;box-shadow:0 18px 36px rgba(46,46,31,0.15);display:grid;grid-template-columns:0.9fr 1.1fr;max-width:900px;}
  .blog-card .img{min-height:260px;}
  .blog-card img{width:100%;height:100%;object-fit:cover;display:block;}
  .blog-card .body{padding:2rem;display:flex;flex-direction:column;gap:0.8rem;justify-content:center;}
  .blog-meta{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--olive-dark);font-weight:600;}
  .blog-card h3{font-size:1.5rem;line-height:1.25;}
  .blog-card p{color:var(--ink-soft);font-size:0.95rem;line-height:1.6;}
  .blog-card .btn{align-self:flex-start;margin-top:0.4rem;}
